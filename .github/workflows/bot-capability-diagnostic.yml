name: Bot capability diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Focused capability matrix or the actual full npm test gate'
        type: choice
        options: [focused, full]
        default: focused
permissions:
  contents: read
jobs:
  capabilities:
    name: Windows real Bot capability · ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.mode == 'full' && '["full"]' || '["browser","history","all"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real test boundary (focused 180s / full 900s watchdog)
        run: node scripts/diagnose-bot-capabilities.mjs ${{ matrix.scenario }}
