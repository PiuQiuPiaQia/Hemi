name: Bot capability diagnostic
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  capabilities:
    name: Windows real Bot capability · ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        scenario: [browser, history, all]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real SDK and browser boundary (180s watchdog)
        run: node scripts/diagnose-bot-capabilities.mjs ${{ matrix.scenario }}
