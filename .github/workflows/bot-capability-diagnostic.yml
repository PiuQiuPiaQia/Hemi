name: Bot capability diagnostic
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Focused checks, full gate, or full-suite default/serial timing comparison'
        type: choice
        options: [focused, full, jobs, timing]
        default: focused
permissions:
  contents: read
jobs:
  capabilities:
    name: Windows real Bot capability · ${{ matrix.scenario }}
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: ${{ fromJSON(inputs.mode == 'timing' && '["full-default","full-serial"]' || inputs.mode == 'full' && '["full"]' || inputs.mode == 'jobs' && '["jobs","jobs-delayed"]' || '["browser","history","all"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Real test boundary (focused 180s / full 900s watchdog)
        run: node scripts/diagnose-bot-capabilities.mjs ${{ matrix.scenario }}
