<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晴海蓝 · 人物动作试片</title>
  <style>
    *{box-sizing:border-box}body{margin:0;color:#29364a;background:#f6f6f5;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:min(1200px,calc(100% - 32px));margin:22px auto}header{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-bottom:14px}h1{font-size:17px;font-weight:600;margin:0}header span{font-size:12px;color:#8993a2}.player{border:1px solid #dce4f0;border-radius:12px;overflow:hidden}.stage{width:100%;aspect-ratio:3/2;position:relative;overflow:hidden;background:radial-gradient(ellipse at 76% 28%,#fff 0,transparent 50%),linear-gradient(145deg,#e1eafb,#f6f9fd 50%,#c6daf5)}.logical{position:absolute;width:1440px;height:960px;transform-origin:0 0;overflow:hidden}.scene-line{position:absolute;left:-20%;top:73%;width:145%;height:50%;border:1px solid #ffffffb0;border-radius:50%;transform:rotate(-8deg);background:linear-gradient(#abc9ed26,#ecf4fd00)}.hero{position:absolute;right:-40px;bottom:-68px;height:1020px;width:835px}.lettering{position:absolute;left:110px;top:104px;color:#7893b6;transform:rotate(-6deg)}.lettering strong{display:block;font:400 114px/1.1 "Snell Roundhand","Apple Chancery",serif}.lettering em{display:block;font:italic 22px/1.3 Baskerville,Georgia,serif;letter-spacing:.16em;margin:10px 0 0 65px;color:#90a6c0}.detail{position:absolute;left:114px;top:350px;width:450px;height:338px;border-radius:20px;overflow:hidden;background:linear-gradient(135deg,#fbfdff,#e5eefb);box-shadow:0 14px 55px #42679712,inset 0 0 0 1px #fff}.detail canvas{width:100%;height:100%;display:block}.detail-label{position:absolute;left:116px;top:710px;font-size:14px;color:#7790ad}.detail-label i{display:inline-block;width:5px;height:5px;border-radius:50%;background:#86a4ca;margin-right:8px;vertical-align:middle}.parameters{position:absolute;left:116px;top:760px;display:flex;gap:18px;color:#8b9bb1;font-size:12px;font-variant-numeric:tabular-nums}.controls{padding:12px;background:#fff;border-top:1px solid #e0e7ef;display:flex;align-items:center;gap:8px;flex-wrap:wrap}button{min-height:33px;font:inherit;font-size:12px;color:#385f9f;background:#fff;border:1px solid #dce4f0;border-radius:7px;padding:6px 12px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#edf3ff}button:focus-visible,input:focus-visible{outline:2px solid #385f9f;outline-offset:3px}.controls label{font-size:12px;color:#7b8ca4;display:flex;align-items:center;gap:6px}input{accent-color:#385f9f}.timeline{flex:1;min-width:110px}output{font:12px ui-monospace,monospace;color:#7b8798;min-width:66px}.note{font-size:12px;color:#788294;line-height:1.8}a{color:#385f9f}.error{display:none;color:#a63034;padding:14px}.capture main{width:100%;margin:0}.capture header,.capture .controls,.capture .note{display:none}.capture .player{border:0;border-radius:0}.capture .stage{width:100vw;height:100vh;aspect-ratio:auto}@media(max-width:600px){main{width:calc(100% - 20px);margin:14px auto}header{display:block}header span{display:block;margin-top:7px}.controls{gap:7px}.controls label{font-size:11px}}
  </style>
</head>
<body>
<main>
  <header><h1>晴海蓝 · 人物动作试片</h1><span>局部眼睛关键帧 + 参数驱动网格 / 非正式 Live2D 模型</span></header>
  <div class="player"><div class="stage"><div class="logical"><div class="scene-line"></div><div class="lettering"><strong>Smile</strong><em>DeepSeek</em></div><canvas class="hero" id="hero" width="1135" height="1386" aria-label="完整人物，眼睛眨动，头发与衣饰轻动"></canvas><div class="detail"><canvas id="face" width="900" height="676" aria-label="与完整人物同步的脸部放大特写"></canvas></div><div class="detail-label"><i></i>面部特写 · 与右侧同步</div><div class="parameters"><span id="eye-value">眼睛闭合 0%</span><span id="hair-value">发丝摆动 0.0px</span></div></div></div><div class="controls"><button id="toggle" type="button">暂停</button><button id="blink" type="button">眨眼一次</button><button id="mesh" type="button" aria-pressed="false">查看变形网格</button><label>眼睛闭合<input id="eye" type="range" min="0" max="1" step=".01" value="0" aria-label="手动眼睛闭合程度"></label><input class="timeline" id="time" type="range" min="0" max="8000" step="10" value="0" aria-label="试片进度，毫秒"><output>0.0 / 8.0s</output></div></div>
  <p class="note">本试片新增半闭眼、闭眼素材，并只在眼睛区域合成，保留原图其余像素；头发与衣饰使用局部网格权重变形。尚未制作 Cubism 分层 PSD、moc3 模型或抬手动作，未接入 Hemi 生产应用。<a href="README.md">素材与制作记录</a>。</p><p class="error" role="alert"></p>
</main>
<script src="assets-data.js"></script><script src="rig.js"></script>
</body>
</html>
