<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hemi · 主页人物主题预览</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f6f5;color:#252b34;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{width:min(1440px,calc(100% - 32px));margin:20px auto}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}h1{font-size:17px;font-weight:600;margin:0}p{font-size:12px;color:#737b86;line-height:1.7}nav{display:flex;gap:6px}button{font:inherit;font-size:12px;color:#61718a;background:#fff;border:1px solid #dce4f0;border-radius:7px;padding:8px 13px;cursor:pointer}button[aria-selected=true]{background:#e4edfd;border-color:#9db8e3;color:#385f9f}button:focus-visible{outline:2px solid #385f9f;outline-offset:3px}figure{margin:0;border:1px solid #dce4f0;border-radius:12px;overflow:hidden;background:white}figure img{display:block;width:100%;height:auto}figcaption{padding:12px 16px;font-size:12px;line-height:1.65;color:#728096;border-top:1px solid #e8edf4}a{color:#385f9f;text-underline-offset:3px}.links{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}@media(max-width:600px){main{width:calc(100% - 20px);margin:14px auto}header{align-items:flex-start;flex-direction:column}nav{width:100%}button{flex:1}}
  </style>
</head>
<body>
<main>
  <header><h1>晴海蓝 · 主页背景</h1><nav role="tablist" aria-label="查看页面状态"><button type="button" role="tab" id="tab-welcome" aria-selected="true" aria-controls="preview">主页</button><button type="button" role="tab" id="tab-conversation" aria-selected="false" aria-controls="preview" tabindex="-1">会话阅读</button></nav></header>
  <figure id="preview" role="tabpanel" aria-labelledby="tab-welcome"><img id="screen" src="welcome.png" alt="Hemi 主页视觉稿：右侧蓝发人物，左侧 Smile 与 DeepSeek，输入区沿用现有布局"><figcaption id="caption">右侧大幅人物，左侧沿用原图的 Smile / DeepSeek。保留现有导航、会话列表、欢迎语和输入区。</figcaption></figure>
  <p class="links"><span>静态视觉稿，尚未接入应用；截图中的任务文字为演示内容。</span><span><a href="welcome-560.png">窄窗主页</a> · <a href="conversation-560.png">窄窗会话</a> · <a href="../motion-preview-v2/index.html">冷启动与主页动效预演</a></span></p>
</main>
<script>
const buttons=[...document.querySelectorAll('[role=tab]')],screen=document.querySelector('#screen'),panel=document.querySelector('#preview'),caption=document.querySelector('#caption');
function select(index){buttons.forEach((button,i)=>{button.setAttribute('aria-selected',String(i===index));button.tabIndex=i===index?0:-1;});panel.setAttribute('aria-labelledby',buttons[index].id);screen.src=index?'conversation.png':'welcome.png';screen.alt=index?'Hemi 会话阅读视觉稿：阅读区增加白色遮盖，右侧人物淡化，保留原有正文和输入框':'Hemi 主页视觉稿：右侧蓝发人物，左侧 Smile 与 DeepSeek，输入区沿用现有布局';caption.textContent=index?'进入会话后淡化人物，收起装饰文字，提高正文区域白底遮盖；输入框保留实色底。':'右侧大幅人物，左侧沿用原图的 Smile / DeepSeek。保留现有导航、会话列表、欢迎语和输入区。';}
buttons.forEach((button,i)=>{button.onclick=()=>select(i);button.onkeydown=event=>{if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const next=1-i;select(next);buttons[next].focus();}};});
</script>
</body>
</html>
