<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hemi · 冷启动到动态主页完整演示</title><style>
:root{color-scheme:light;--ink:#29364a;--muted:#566b84;--accent:#385f9f;--line:#dce4f0;--paper:#fff;--soft:#edf3ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf2fb;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.preview{height:100dvh;display:grid;grid-template-rows:minmax(0,1fr) auto}iframe{display:block;width:100%;height:100%;border:0}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 16px;background:var(--paper);border-top:1px solid var(--line);font-size:12px}.label{color:var(--muted);margin-right:auto}button{font:inherit;color:var(--accent);border:1px solid var(--line);border-radius:7px;background:var(--paper);padding:6px 11px;min-height:32px;cursor:pointer;white-space:nowrap}button:hover{background:var(--soft)}button[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent)}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}input{width:140px;accent-color:var(--accent)}output,.status{font-variant-numeric:tabular-nums;color:var(--muted)}output{min-width:72px}.capture .controls{display:none}.capture .preview{grid-template-rows:minmax(0,1fr)}@media(max-width:900px){.label{width:100%;margin-bottom:2px}input{flex:1;min-width:80px}.controls{padding:8px 10px;gap:6px}}
</style></head><body><main class="preview"><iframe id="scene" title="Hemi 冷启动和主页动画只读完整预演"></iframe><footer class="controls"><span class="label">冷启动 → 主页人物动画 · 只读预演</span><button id="replay" type="button">重播完整演示</button><button id="home" type="button">直接看主页</button><button id="toggle" type="button">暂停</button><button id="skip" type="button">跳过片头</button><input id="progress" type="range" min="0" max="14000" step="10" value="0" aria-label="完整演示进度，毫秒"><output>0.0 / 14.0s</output><span class="status" aria-live="polite">准备画面</span></footer></main><script>
(() => {
 const $=s=>document.querySelector(s),frame=$('#scene'),capture=new URLSearchParams(location.search).has('capture');if(capture)document.body.classList.add('capture');let current={phase:'boot',time:0,playing:false},id=0,resolveReady;const pending=new Map();window.previewReady=new Promise(resolve=>resolveReady=resolve);
 function reflect(state){current=state;$('#replay').setAttribute('aria-pressed',String(state.phase==='boot'));$('#home').setAttribute('aria-pressed',String(state.phase==='home'));$('#toggle').textContent=state.playing?'暂停':'播放';$('#skip').disabled=state.phase!=='boot';const shown=state.time<=14000?state.time:6000+(state.time-6000)%8000;$('#progress').value=shown;$('output').textContent=`${(shown/1000).toFixed(1)} / 14.0s`;$('.status').textContent=state.failure?'静态回退':state.staticHome?'静态主页':state.phase==='boot'?'冷启动演出':state.playing?'主页循环':'主页已暂停';}
 function command(action,rest={}){return new Promise((resolve,reject)=>{const requestId=++id;pending.set(requestId,{resolve,reject});frame.contentWindow.postMessage({type:'hemi-demo-command',requestId,action,...rest},'*');});}
 addEventListener('message',event=>{if(event.source!==frame.contentWindow)return;const message=event.data;if(message?.type==='hemi-demo-ready'){reflect(message.state);resolveReady(true);}if(message?.type==='hemi-demo-state'){reflect(message.state);if(pending.has(message.requestId)){pending.get(message.requestId).resolve(message.state);pending.delete(message.requestId);}}if(message?.type==='hemi-demo-error'){if(pending.has(message.requestId)){pending.get(message.requestId).reject(new Error(message.message));pending.delete(message.requestId);}$('.status').textContent=message.message;}});
 $('#replay').onclick=()=>command('replay');$('#home').onclick=()=>command('home');$('#toggle').onclick=()=>command(current.playing?'pause':'play');$('#skip').onclick=()=>command('skip');$('#progress').oninput=()=>command('seek',{time:Number($('#progress').value)});
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&current.ready)command('pause');});document.addEventListener('keydown',event=>{if(event.code==='Escape'&&current.phase==='boot')command('skip');if(event.code==='Space'&&!['INPUT','BUTTON'].includes(event.target.tagName)){event.preventDefault();$('#toggle').click();}});
 window.preview={seek:time=>command('seek',{time}),play:()=>command('play'),pause:()=>command('pause'),replay:()=>command('replay'),home:(autoplay=true)=>command('home',{autoplay}),skip:()=>command('skip'),getState:()=>({...current}),duration:14000};frame.src='scene.html'+(capture?'?capture':'');
})();
</script></body></html>
